name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 宿主框架自动 clone 进 .sveltecms/ 并装配（scripts/ensure-host.mjs
      # 由 pnpm test 前置触发）——与本地开发同一条路径
      - name: Install plugin deps
        run: pnpm install --frozen-lockfile
      - name: Unit tests (auto-ensures host)
        run: pnpm test
      - name: svelte-check
        run: pnpm check

  e2e:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
