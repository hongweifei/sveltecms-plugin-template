name: Release

on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Build zip（根布局：plugin.ts 在 zip 根）
        run: node scripts/package.mjs | tee package-out.txt
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            SHA-256 见工作流日志（package.mjs 输出），市场 static 项可回填。
            repo 型市场条目无需回填——本 Release 资产自动被注册表解析。
